# Example Nginx configuration for Laravel over WireGuard VPN
#
# Place this on the server (e.g. /etc/nginx/sites-available/avgames) and
# enable with ln -s to sites-enabled. Adjust paths and PHP socket as needed.

server {
    listen 10.8.0.1:80;               # listen only on the VPN interface
    server_name 10.8.0.1;             # you can add a DNS name if you have one

    root /home/benemerito/VisualProjects/avgames/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
